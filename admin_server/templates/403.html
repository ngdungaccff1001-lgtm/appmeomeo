<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Forbidden • Access Denied</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;800&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #080a0f;
            color: #f0f2f5;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .box {
            background: #11141e;
            border: 1px solid #ff2a42;
            box-shadow: 0 0 30px rgba(255, 42, 66, 0.2);
            border-radius: 8px;
            padding: 40px 30px;
            max-width: 460px;
            width: 100%;
        }
        .code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 64px;
            font-weight: 800;
            color: #ff2a42;
            letter-spacing: 4px;
            line-height: 1;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        p {
            font-size: 13px;
            color: #8b949e;
            line-height: 1.6;
        }
        .ip {
            margin-top: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: #555e70;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="code">403</div>
        <h1>ACCESS FORBIDDEN</h1>
        <p>Hệ thống máy chủ được bảo vệ bởi MeoMeoPath Security Engine. Bạn không có quyền truy cập trực tiếp vào thư mục gốc này.</p>
        <div class="ip">PROTECTED GATEWAY • APIMEOMEO CORE</div>
    </div>
</body>
</html>
